<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Learning Notebook</title>

  <!-- Free handwriting font from Google Fonts. If you are offline, the app uses a fallback font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <!-- CSS: the looks -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/notebook-theme.css">
  <link rel="stylesheet" href="css/lesson.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="app-header">
    <a class="home-link" href="#/">📓 My Learning Notebook</a>
    <span id="storage-warning" class="storage-warning" hidden>
      Saving is blocked in this browser. Your notes will disappear when you close the page.
    </span>
  </header>

  <!-- The router puts the Home, Subject, or Lesson page inside this box -->
  <main id="app" class="container" tabindex="-1">
    <p>Loading your notebook…</p>
  </main>

  <noscript>This notebook needs JavaScript to work. Please turn it on.</noscript>

  <footer class="app-footer">
    Your notes are saved in this browser on this device only.
  </footer>

  <!-- JS: data first, then the helpers, then the page builders, then the starter -->
  <script src="data/subjects.js"></script>
  <script src="data/lessons/electricity-voltage.js"></script>
  <script src="data/lessons/electricity-current.js"></script>
  <script src="data/lessons/electricity-resistance.js"></script>
  <script src="data/lessons/electricity-ohms-law.js"></script>

  <script src="js/storage.js"></script>
  <script src="js/render-home.js"></script>
  <script src="js/render-subject.js"></script>
  <script src="js/image-store.js"></script>
  <script src="js/render-pictures.js"></script>
  <script src="js/render-lesson.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
